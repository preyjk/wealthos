services:
  db:
    image: postgres:17
    container_name: wealthos-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: wealthos
      POSTGRES_PASSWORD: wealthos_local_only
      POSTGRES_DB: wealthos
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wealthos -d wealthos"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
